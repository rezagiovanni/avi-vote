name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      SOURCE_PATH: ./
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/816891501188/locations/global/workloadIdentityPools/avi-vote-pool/providers/github-provider"
          service_account: "avi-vote@data-gym-480909.iam.gserviceaccount.com"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: avi-vote
          region: asia-southeast2
          project_id: data-gym-480909
          source: ${{ env.SOURCE_PATH }}
          no_traffic: false
          wait: true
